services:
  postgres:
    image: postgres:16
    container_name: card-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - "5432:5432"
    volumes:
      - card-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U card -d card"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    container_name: card-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - card-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  card-postgres-data:
  card-redis-data:
