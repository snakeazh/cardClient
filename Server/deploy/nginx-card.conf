server {
    listen 80;
    server_name api.txys.ltd;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.txys.ltd;

    ssl_certificate     /etc/nginx/cert/api.txys.ltd.pem;
    ssl_certificate_key /etc/nginx/cert/api.txys.ltd.key;

    client_max_body_size 2m;

    # GM 后台静态页（admin-web 构建产物，deploy.sh 同步到 /opt/card-server/admin/）
    # 路径用 /gm/ 而不用 /admin/：避开安全设备对 admin 关键字的拦截
    location /gm/ {
        alias /opt/card-server/admin/;
        index index.html;
    }

    # GM 接口：公网可达，靠管理密码（X-Admin-Token）保护，无密码 401
    location /v1/gm/ {
        proxy_pass http://127.0.0.1:5254;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:5254;
        proxy_http_version 1.1;

        # PVP WebSocket 必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接：覆盖默认 60s
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
